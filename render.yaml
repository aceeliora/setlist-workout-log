services:
  - type: web
    name: setlist-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: setlist-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/workouts.db
      - key: FRONTEND_ORIGIN
        sync: false
